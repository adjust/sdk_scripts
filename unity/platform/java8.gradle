// Unity's bundled Gradle cannot dex the test modules when they target newer Java 
// or need compileSdk 37 so build them for Java 8 without changing the android_sdk submodule
gradle.beforeProject { project ->
    if (project.path in [':tests:test-library', ':tests:test-options']) {
        project.plugins.withId('com.android.library') {
            project.android.compileOptions.sourceCompatibility = JavaVersion.VERSION_1_8
            project.android.compileOptions.targetCompatibility = JavaVersion.VERSION_1_8
            project.android.defaultConfig.aarMetadata.minCompileSdk = 1
        }
    }
}
